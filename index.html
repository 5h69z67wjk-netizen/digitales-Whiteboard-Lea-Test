<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Erweitertes Whiteboard</title>
    <!-- Fabric.js – leichtgewichtige Canvas‑Bibliothek -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"
            integrity="sha512-VA8vB33GubKXv3iCKzJ9hmA6TmSKIdWzZy2FJzXN4bF7wgZ0eoU0ER2No2FKM76urlK9hKfKfzgpOfWzV2dyTg=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==== Toolbar ==== -->
    <div id="toolbar">
        <button id="drawBtn">✏️ Freihand</button>
        <button id="textBtn">🔤 Text</button>
        <button id="imageBtn">🖼️ Bild</button>
        <button id="noteBtn">📓 Sticky‑Note</button>
        <button id="lockBtn">🔒 Sperren / Entsperren</button>

        <label for="permSelect">Berechtigung:</label>
        <select id="permSelect">
            <option value="read">Nur Lesen</option>
            <option value="partial" selected>Teil‑Bearbeitung</option>
            <option value="full">Voll‑Bearbeitung</option>
        </select>

        <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>

    <!-- ==== Canvas ==== -->
    <canvas id="board"></canvas>

    <script src="script.js"></script>
</body>
</html>
